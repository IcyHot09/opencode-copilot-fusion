name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  id-token: write   # npm trusted publishing (OIDC)
  contents: write   # create the GitHub release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm ci
      - run: npm test

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, keeping it"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi

      - name: Summary
        run: echo "Published $GITHUB_REF_NAME to npm and created the GitHub release"
